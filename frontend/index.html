<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的课表</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<section id="login-view" class="login-wrap">
  <div class="login-card">
    <div class="logo">课</div>
    <h1>我的课表</h1>
    <p class="sub">广东机电职业技术学院 · 统一身份认证登录</p>

    <div class="tabs">
      <button class="tab active" data-mode="pwd" type="button">账号密码</button>
      <button class="tab" data-mode="cookie" type="button">Cookie 登录</button>
    </div>

    <form id="pwd-form" autocomplete="on">
      <label>学号
        <input id="username" name="username" autocomplete="username" placeholder="例如 25120321">
      </label>
      <label>密码
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="统一身份认证密码">
      </label>
      <button class="btn primary" type="submit" id="pwd-submit">登录</button>
    </form>

    <form id="cookie-form" class="hidden">
      <label>Cookie
        <textarea id="cookie" rows="4" spellcheck="false"
          placeholder="浏览器登录教务系统后，F12 → Network → 任意请求 → Request Headers 里的 Cookie 整行"></textarea>
      </label>
      <button class="btn primary" type="submit" id="cookie-submit">用 Cookie 登录</button>
    </form>

    <p id="login-msg" class="msg"></p>
  </div>
</section>

<!-- ============ 主界面 ============ -->
<section id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo small">课</span>
      <span>我的课表</span>
    </div>

    <div class="controls">
      <select id="sel-xnm" title="学年"></select>
      <select id="sel-xqm" title="学期"></select>

      <div class="week-nav">
        <button id="prev-week" class="btn icon" title="上一周">‹</button>
        <select id="sel-week" title="周次"></select>
        <button id="next-week" class="btn icon" title="下一周">›</button>
        <button id="this-week" class="btn ghost">本周</button>
      </div>

      <label class="date-field" title="开学第一周的周一，用于计算当前周">
        <span>开学</span>
        <input id="start-date" type="date">
      </label>

      <button id="logout" class="btn ghost">退出</button>
    </div>
  </header>

  <div id="student-bar" class="student-bar"></div>

  <main>
    <div id="grid" class="grid"></div>
    <p id="app-msg" class="msg"></p>
  </main>
</section>

<!-- ============ 详情弹层 ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modal-close" class="modal-close" type="button">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
